name: Run Automated Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: Environment
        required: true
        type: choice
        default: dev
        options:
          - dev
          - preprod
          - prod

env:
  MAVEN_CLI_OPTS: "--batch-mode --no-transfer-progress"
  MAVEN_OPTS: "-DskipTests=false"
  CI_PIPELINE_IID: "${{ github.run_id }}"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Environment
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Compile Code
        run: |
          echo "Compiling code..."
          mvn ${MAVEN_CLI_OPTS} ${MAVEN_OPTS} clean compile -DBUILD_VERSION=${CI_PIPELINE_IID}

      - name: Check Dependencies
        run: |
          echo "Checking Dependencies..."
          mvn ${MAVEN_CLI_OPTS} ${MAVEN_OPTS} dependency:resolve -DBUILD_VERSION=${CI_PIPELINE_IID}

      - name: Spotless Check
        run: mvn ${MAVEN_CLI_OPTS} spotless:check

      - name: Run Automated Tests
        env:
          TEST_ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}
        run: mvn ${MAVEN_CLI_OPTS} ${MAVEN_OPTS} test -Denvironment=${TEST_ENVIRONMENT}

      - name: Logging
        run: |
          echo "Extracting Logs..."
          cat target/logs/execution.log || echo "No execution.log found"
          echo "Generating Test Report..."

      - name: Test Report
        uses: actions/upload-artifact@v7
        with:
          name: test_report
          path: |
            target/generated-report.html
            target/logs/execution.log
          retention-days: 7
          overwrite: true